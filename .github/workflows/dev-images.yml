name: Docker Dev Images Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'client/**'
      - 'config/**'
      - 'skill/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - 'Dockerfile.multi'
      - '.dockerignore'
      - '!**.md'
      # Deployment skills are Markdown the image ships and reads at runtime
      # (skill/<name>/SKILL.md plus md resources); re-include them after the
      # !**.md exclusion (later patterns win), keeping the top-level README
      # documentation-only.
      - 'skill/**/*.md'
      - '!skill/README.md'

permissions:
  contents: read
  packages: write

jobs:
  check-dockerhub-secrets:
    runs-on: ubuntu-latest
    outputs:
      has_dockerhub_secrets: ${{ steps.check-dockerhub-secrets.outputs.has_dockerhub_secrets }}
    steps:
      - name: Check Docker Hub secrets
        id: check-dockerhub-secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "has_dockerhub_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_dockerhub_secrets=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check-dockerhub-secrets
    if: ${{ needs.check-dockerhub-secrets.outputs.has_dockerhub_secrets == 'true' }}
    uses: ./.github/workflows/docker-publish.yml
    with:
      images: >-
        [{"target":"api-build","file":"Dockerfile.multi","image_name":"librechat-dev-api"},
         {"target":"node","file":"Dockerfile","image_name":"librechat-dev"}]
      tag_suffixes: |
        ${{ github.sha }}
        latest
      build_branch: ${{ github.ref_name }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      LEGACY_GHCR_TOKEN: ${{ secrets.LEGACY_GHCR_TOKEN }}
